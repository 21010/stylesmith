name: Release

# Builds a version when its tag is pushed, for example: git tag v1.14.2 && git push origin v1.14.2
#
# 1. All of CI runs on the tagged commit.
# 2. The .vsix is built once, with a signed build provenance.
# 3. A GitHub Release is created with that file and the version's CHANGELOG section.
#
# Publishing is done by hand: download the .vsix from the release and upload it on
# https://marketplace.visualstudio.com/manage. No publishing token is stored anywhere.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to sign the build provenance
      attestations: write
    outputs:
      file: ${{ steps.build.outputs.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG doesn't match the version in package.json ($version)."
            exit 1
          fi
          node scripts/release-notes.mjs "$version" > /dev/null
      - name: Build the package
        id: build
        run: |
          file="stylesmith-$(node -p "require('./package.json').version").vsix"
          npx vsce package --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.file }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ${{ steps.build.outputs.file }}
          if-no-files-found: error

  github-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ needs.package.outputs.file }}
        run: |
          node scripts/release-notes.mjs "${TAG#v}" > notes.md
          gh release create "$TAG" "$FILE" --title "Stylesmith ${TAG#v}" --notes-file notes.md --verify-tag
