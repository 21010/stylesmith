name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI first.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify package signatures and provenance
        run: npm audit signatures
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Checks the static website in Chromium (not the VS Code workbench).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install headless Chromium
        run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run test:browser

  # Runs Stylesmith inside VS Code: checks API settings and that the installation stays unchanged.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.93.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .vscode-test/vscode-*
          key: vscode-${{ matrix.vscode }}-${{ runner.os }}
      - run: npm ci --ignore-scripts
      - name: Run the end-to-end test in VS Code ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
